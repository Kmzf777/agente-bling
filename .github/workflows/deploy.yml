name: CI / Deploy VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Testes ─────────────────────────────────────────────────────────────
  test:
    name: Testes & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  # ── 2. Deploy (apenas em push na main) ────────────────────────────────────
  deploy:
    name: Deploy na VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build do frontend
        run: |
          npm --prefix web install
          npm --prefix web run build

      - name: Atualiza backend na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            # Força a VPS a bater exatamente com origin/main. `git pull` falha se a árvore
            # de trabalho estiver suja (ex.: arquivo rastreado alterado) — o reset --hard
            # resolve. Seguro: .env, .bling-tokens.json e web/dist são gitignored e ficam.
            git fetch origin main
            git reset --hard origin/main
            echo "Deploy em: $(git rev-parse --short HEAD)"
            npm ci --omit=dev

      - name: Copia build do frontend para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'web/dist/*'
          target: '${{ secrets.VPS_APP_PATH }}/web/dist'
          strip_components: 2

      - name: Reinicia servidor via PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
