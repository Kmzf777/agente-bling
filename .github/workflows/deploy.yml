name: CI / Deploy VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Testes ─────────────────────────────────────────────────────────────
  test:
    name: Testes & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  # ── 2. Deploy (apenas em push na main) ────────────────────────────────────
  deploy:
    name: Deploy na VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build do frontend
        run: |
          npm --prefix web install
          npm --prefix web run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/agente-bling-cafe

            # Atualiza o código
            git pull origin main

            # Instala dependências de produção
            npm ci --omit=dev

            # Reinstala tsx (movido para dependencies; garantia)
            npm install tsx --no-save 2>/dev/null || true

            # Copia o build do frontend (gerado no runner)
            # (o runner faz upload via scp em etapa separada)

            # Reinicia com PM2
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

      - name: Copia build do frontend para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'web/dist/*'
          target: '~/agente-bling-cafe/web/dist'
          strip_components: 2
