# Configuração nginx para o Agente Bling Café na VPS.
#
# Como usar:
#   sudo cp docs/nginx-agente-bling.conf /etc/nginx/sites-available/agente-bling
#   sudo ln -s /etc/nginx/sites-available/agente-bling /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d SEU_DOMINIO.com   # emite certificado TLS grátis (Let's Encrypt)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Substitua SEU_DOMINIO.com pelo domínio real antes de usar.

server {
    listen 80;
    server_name SEU_DOMINIO.com;

    # Redireciona todo HTTP → HTTPS (será preenchido pelo certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name SEU_DOMINIO.com;

    # Certificados TLS (gerenciados pelo certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Frontend (arquivos estáticos do build Vite) ─────────────────────────
    root /home/deploy/agente-bling-cafe/web/dist;
    index index.html;

    # SPA fallback: qualquer rota que não seja arquivo real vai para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API (proxy reverso para o backend Node/Express em :3000) ───────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Suporte a streaming (Server-Sent Events / chunked responses)
        proxy_buffering    off;
        proxy_cache        off;

        # Headers padrão de proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout maior para respostas longas do agente
        proxy_read_timeout 120s;
    }

    # Compressão gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
